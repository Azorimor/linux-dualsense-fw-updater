name: CI

on:
  workflow_dispatch:
    inputs:
      is_release:
        description: "Also build and package Linux portable .tar.gz release artifact"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Version tag used when packaging release artifacts (defaults to Cargo.toml version)"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      is_release:
        description: "Build and package Linux portable .tar.gz release artifact"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        type: string
        required: false
        default: ""
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "website/**"
      # Note: README.md, LICENSES/**, packaging/**, and REUSE.toml trigger prechecks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  QMAKE: /usr/bin/qmake6
  CARGO_TERM_COLOR: always

jobs:
  prechecks:
    name: Fast Checks (REUSE, Structural, Fmt, Licenses)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check REUSE SPDX compliance
        uses: fsfe/reuse-action@v5

      - name: Verify structural and licensing rules
        run: python3 scripts/verify_structural_rules.py

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Audit dependency licenses
        run: cargo deny --locked --all-features check licenses

  check:
    name: Clippy, Test & Coverage (Ubuntu 24.04)
    needs: prechecks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Note: Ubuntu 24.04 (noble) does not package KF6 Kirigami
      # (`qml6-module-org-kde-kirigami`), so QML runtime/lint steps requiring
      # KF6 Kirigami are not invoked directly on `ubuntu-24.04`. All Qt6 C++
      # compilation, `cxx-qt` linking, QML binding/asset checks
      # (`qml_bindings_test`), structural checks, and 100% headless tests run natively.
      - name: Install Ubuntu 24.04 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            mold \
            pkg-config \
            libudev-dev \
            libusb-1.0-0-dev \
            libgl-dev \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qmake6 \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Lint workspace with clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run all tests with coverage and print summary
        run: |
          ./scripts/coverage.sh --locked
          {
            echo "## Workspace Code Coverage"
            echo ""
            echo '```text'
            cargo llvm-cov report --workspace --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: target/coverage/
          if-no-files-found: error

  build-linux:
    name: Build & Package Linux Portable Tarball (${{ matrix.arch }})
    needs: check
    if: ${{ inputs.is_release == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu 24.04 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            mold \
            pkg-config \
            libudev-dev \
            libusb-1.0-0-dev \
            libgl-dev \
            libxkbcommon-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qmake6 \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Resolve release tag
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="v$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="dualsense-updater"))')"
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build release binary and package portable tarball
        run: |
          cargo build --release --locked
          readelf -p .comment target/release/dualsense-updater | grep -i mold
          ARCH="${{ matrix.arch }}" ./scripts/package-appimage.sh --tarball-only target/release/dualsense-updater "$RELEASE_TAG" dist

      - name: Verify portable tarball license compliance and dynamic links
        run: |
          TARBALL="dist/linux-dualsense-fw-updater-${RELEASE_TAG}-${{ matrix.arch }}.tar.gz"
          test -f "$TARBALL"
          python3 scripts/verify_tarball_compliance.py "$TARBALL"

      - name: Upload Linux portable tarball release artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v6
        with:
          name: linux-release-artifacts-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
