name: Deploy Website

on:
  workflow_dispatch:
  # Uncomment when public: enable automatic website builds on push to main:
  # push:
  #   branches: [main]
  #   paths:
  #     - "website/**"
  #     - ".github/workflows/deploy-website.yml"

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Fumadocs Static Site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build and optimize static site
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          touch out/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-static-out
          path: website/out/
          if-no-files-found: error

      # Uncomment when public: deploy built static site to GitHub Pages (`pages` branch):
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_branch: pages
      #     publish_dir: ./website/out
      #     # cname: dualsense.example.com
