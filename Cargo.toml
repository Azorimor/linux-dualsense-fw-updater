[workspace]
members = [".", "crates/dualsense-core", "crates/dualsense-ui"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-build = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
env_logger = "0.11.8"
hidapi = "2.6.4"
log = "0.4.29"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
ureq = "3.5.2"
dualsense-core = { path = "crates/dualsense-core" }
dualsense-ui = { path = "crates/dualsense-ui" }

[package]
name = "dualsense-updater"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
dualsense-ui.workspace = true
env_logger.workspace = true
log.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
dualsense-core.workspace = true
