version = 1

[[annotations]]
path = [
    "Cargo.lock",
    "CHANGELOG.md",
    ".gitignore",
    ".githooks/**",
    ".github/ISSUE_TEMPLATE/**",
    ".agents/**",
    "assets/**",
    "packaging/**",
    "website/.gitignore",
    "website/package.json",
    "website/package-lock.json",
    "website/tsconfig.json",
    "website/content/docs/meta.json",
    "website/public/**",
    "website/src/assets/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Azorimor <azorimor@gmail.com>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "packaging/linux/THIRD_PARTY_NOTICES.txt"
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Azorimor <azorimor@gmail.com>",
    "The Qt Company Ltd. and contributors",
    "KDE e.V. and contributors",
    "Alan Ott / signal11 and libusb maintainers",
    "Klarälvdalens Datakonsult AB (KDAB)",
]
SPDX-License-Identifier = "GPL-3.0-or-later AND Apache-2.0 AND LGPL-3.0-only AND LGPL-2.1-or-later AND LGPL-2.0-or-later AND BSD-3-Clause"
