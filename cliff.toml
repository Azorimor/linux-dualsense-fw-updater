[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
          {% if commit.breaking %} (**BREAKING**){% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Azorimor/linux-dualsense-fw-updater/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build & Packaging" },
    { message = "^ci", group = "CI / Workflows" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore(\\(dualsense-updater\\))?: release", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore|^style", group = "Miscellaneous" },
    { message = "^revert", group = "Reverts" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
