<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>

  <!-- DualSense silhouette -->
  <path
    d="M78 88 C58 88 45 104 39 128 L29 170 C26 184 35 196 49 196 C59 196 67 190 73 178 L87 152 C92 144 100 140 110 140 L146 140 C156 140 164 144 169 152 L183 178 C189 190 197 196 207 196 C221 196 230 184 227 170 L217 128 C211 104 198 88 178 88 L158 88 L152 94 L104 94 L98 88 Z"
    fill="url(#shell)"
    stroke="#0f172a"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Center touchpad with lightbar accent -->
  <path d="M97 92 L159 92 L154 128 L102 128 Z" fill="#1e293b"/>
  <path d="M98 92 L102 126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M158 92 L154 126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- D-pad -->
  <g fill="#334155">
    <rect x="64" y="103" width="10" height="28" rx="3"/>
    <rect x="55" y="112" width="28" height="10" rx="3"/>
  </g>

  <!-- Face buttons -->
  <circle cx="187" cy="105" r="4.5" fill="#10b981"/>
  <circle cx="198" cy="116" r="4.5" fill="#ef4444"/>
  <circle cx="187" cy="127" r="4.5" fill="#3b82f6"/>
  <circle cx="176" cy="116" r="4.5" fill="#ec4899"/>

  <!-- Thumbsticks -->
  <circle cx="96" cy="144" r="13" fill="#0f172a"/>
  <circle cx="96" cy="144" r="8" fill="#334155"/>
  <circle cx="160" cy="144" r="13" fill="#0f172a"/>
  <circle cx="160" cy="144" r="8" fill="#334155"/>

  <!-- Firmware update badge (upward arrow inside touchpad/center) -->
  <circle cx="128" cy="110" r="14" fill="url(#accent)"/>
  <path
    d="M128 101 L120 110 L125 110 L125 119 L131 119 L131 110 L136 110 Z"
    fill="#ffffff"
  />
</svg>
